name: Build Release APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      KEYSTORE_BASE64: ${{ secrets.RENJANA_KEYSTORE_BASE64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-37.2" "build-tools;37.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.1
        with:
          gradle-version: wrapper

      - name: Prepare signing key (optional)
        if: env.KEYSTORE_BASE64 != ''
        run: |
          mkdir -p keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > keystore/renjana-release.jks

      - name: Build release APK
        env:
          RENJANA_RELEASE_STORE_PASSWORD: ${{ secrets.RENJANA_RELEASE_STORE_PASSWORD }}
          RENJANA_RELEASE_KEY_ALIAS: ${{ secrets.RENJANA_RELEASE_KEY_ALIAS }}
          RENJANA_RELEASE_KEY_PASSWORD: ${{ secrets.RENJANA_RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: List APKs
        run: ls -lh app/build/outputs/apk/release/*.apk

      - name: Upload release APKs
        uses: actions/upload-artifact@v7.0.2
        with:
          name: renjana-release-${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload R8 mapping
        uses: actions/upload-artifact@v7.0.2
        with:
          name: renjana-mapping-${{ github.run_number }}
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: ignore
          retention-days: 30
